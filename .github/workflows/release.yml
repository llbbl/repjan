name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: The existing version tag to build and release
        required: true
        type: string
      commit:
        description: The commit that the tag must point to
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SHA: ${{ inputs.commit || github.sha }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: repjan-linux-x64
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: repjan-darwin-arm64
          - target: darwin-x64
            os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: repjan-darwin-x64
          - target: windows-x64
            os: windows-latest
            goos: windows
            goarch: amd64
            artifact: repjan-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify tag commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "${RELEASE_SHA}^{commit}")"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Build binary
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X github.com/llbbl/repjan/internal/cmd.Version=$RELEASE_TAG" -o "$ARTIFACT" ./cmd/repjan

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag commit
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "${RELEASE_SHA}^{commit}")"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/repjan-linux-x64/repjan-linux-x64 release/
          cp artifacts/repjan-darwin-arm64/repjan-darwin-arm64 release/
          cp artifacts/repjan-darwin-x64/repjan-darwin-x64 release/
          cp artifacts/repjan-windows-x64.exe/repjan-windows-x64.exe release/
          chmod +x release/repjan-linux-x64
          chmod +x release/repjan-darwin-arm64
          chmod +x release/repjan-darwin-x64
          ls -la release/

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: CHANGELOG.md
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/repjan-linux-x64
            release/repjan-darwin-arm64
            release/repjan-darwin-x64
            release/repjan-windows-x64.exe
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
