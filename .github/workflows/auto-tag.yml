name: Auto Tag

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Create Version Tag
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    runs-on: ubuntu-latest
    # Tag successful CI runs for pushes to main.
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: ""
          release_branches: main
          commit_sha: ${{ github.event.workflow_run.head_sha }}
          custom_release_rules: |
            feat:minor:Features,
            fix:patch:Bug Fixes,
            docs:patch:Documentation,
            style:patch:Styling,
            refactor:patch:Refactoring,
            perf:patch:Performance,
            test:patch:Testing,
            chore:patch:Chores,
            ci:patch:CI/CD,
            deps:patch:Dependencies

      - name: Summary
        env:
          PREV_TAG: ${{ steps.tag.outputs.previous_tag }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          RELEASE_TYPE: ${{ steps.tag.outputs.release_type }}
        run: |
          {
            echo "### Version Bump Summary"
            echo ""
            echo "- **Previous version:** $PREV_TAG"
            echo "- **New version:** $NEW_TAG"
            echo "- **Bump type:** $RELEASE_TYPE"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    # Tag pushes authenticated with GITHUB_TOKEN do not start another workflow.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      commit: ${{ github.event.workflow_run.head_sha }}
